[project]
name = "f1-race-predictor"
version = "0.1.0"
description = "Pre-race F1 finishing-position and win-probability prediction, built on FastF1, with leakage-safe time-aware evaluation."
requires-python = ">=3.10"
dependencies = [
    "fastf1>=3.3",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "streamlit>=1.30"]

[tool.pytest.ini_options]
testpaths = ["tests"]
